apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-ssm-store
  namespace: eventfund-dev
spec:
  provider:
    aws:
      service: ParameterStore
      # Region lấy từ IRSA/node metadata, không cần hardcode
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
