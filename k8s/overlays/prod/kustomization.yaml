apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eventfund-prod

resources:
  - ../../base

patches:
  # Patch ConfigMap to set NODE_ENV=PROD
  - target:
      kind: ConfigMap
      name: eventfund-backend-config
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: "PROD"

  # Patch ExternalSecret to use /eventfund/prod/backend path
  - target:
      kind: ExternalSecret
      name: eventfund-backend-secret
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/find/path
        value: /eventfund/prod/backend
      - op: replace
        path: /spec/dataFrom/0/rewrite/0/regexp/source
        value: "/eventfund/prod/backend/(.*)"

  # Patch API deployment for prod-specific settings
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Patch HPA for prod-specific settings
  - target:
      kind: HorizontalPodAutoscaler
      name: api-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8

  # Patch Ingress annotations for prod
  - target:
      kind: Ingress
      name: api-ingress
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1tags
        value: "Environment=prod,ManagedBy=kustomize"
