name: Scan – OWASP ZAP Baseline (Full Project)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL of the running app to scan (e.g. https://your-app.com)'
        required: true
        type: string
  push:
    branches: [dev, main, ci/cd]

jobs:
  owasp-zap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url || 'https://reed-nirvanic-brady.ngrok-free.dev/' }}
          cmd_options: '-a'
          fail_action: false
