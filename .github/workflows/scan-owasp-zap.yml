name: Scan – OWASP ZAP (Full Project)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Frontend URL to scan (leave blank to use default)'
        required: false
        type: string
  push:
    branches: [dev, main, ci/cd]

jobs:
  full-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ZAP Full Scan (frontend)
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ inputs.target_url || 'https://reed-nirvanic-brady.ngrok-free.dev/' }}
          cmd_options: '-a'
          fail_action: false

  api-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write ZAP auth header config
        run: |
          mkdir -p .zap
          cat <<EOF > .zap/api-scan.prop
          replacer.full_list(0).description=auth
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Authorization
          replacer.full_list(0).regex=false
          replacer.full_list(0).replacement=Bearer ${{ secrets.ZAP_JWT_TOKEN }}
          EOF

      - name: ZAP API Scan (backend)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'https://reed-nirvanic-brady.ngrok-free.dev/api-docs.json'
          format: openapi
          cmd_options: '-z "-configfile /zap/wrk/.zap/api-scan.prop"'
          fail_action: false
