name: CI

on:
  push:
    branches: [dev, master, ci/cd]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [dev, master, ci/cd]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which services have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-build-frontend.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  contracts:
    uses: ./.github/workflows/reusable-build-contracts.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-build-backend.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      RPC_URL: ${{ secrets.RPC_URL }}

  sonarcloud:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-scan-sonarqube.yml
    with:
      upload_to_s3: false
      scan_type: pr-diff
      pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
