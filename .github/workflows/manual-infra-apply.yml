name: Manual – Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.config.outputs.terraform_version }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_region: ${{ steps.config.outputs.aws_region }}
          TF_VAR_project_name: ${{ steps.config.outputs.project_name }}
          TF_VAR_eks_version: ${{ steps.config.outputs.tf_eks_version }}
          TF_VAR_node_group_instance_types: '["${{ steps.config.outputs.tf_node_instance_type }}"]'
          TF_VAR_node_desired_capacity: ${{ steps.config.outputs.tf_node_desired_capacity }}
          TF_VAR_node_min_capacity: ${{ steps.config.outputs.tf_node_min_capacity }}
          TF_VAR_node_max_capacity: ${{ steps.config.outputs.tf_node_max_capacity }}
          TF_VAR_vpc_cidr: ${{ steps.config.outputs.tf_vpc_cidr }}
          TF_VAR_public_subnets_cidr: ${{ steps.config.outputs.tf_public_subnets_cidr }}
          TF_VAR_private_subnets_cidr: ${{ steps.config.outputs.tf_private_subnets_cidr }}
          TF_VAR_azs: ${{ steps.config.outputs.tf_azs }}
          TF_VAR_ecr_backend_repo: ${{ steps.config.outputs.ecr_backend_repository }}
          TF_VAR_ssm_prefix: /${{ steps.config.outputs.project_name }}/${{ steps.config.outputs.environment }}/backend
          TF_VAR_environment: ${{ steps.config.outputs.environment }}
          TF_VAR_github_actions_role_name: ${{ steps.config.outputs.github_actions_role_name }}
          TF_VAR_github_repos: '["repo:${{ github.repository }}:*"]'
          TF_VAR_security_reports_bucket: ${{ steps.config.outputs.s3_security_reports_bucket }}
          TF_VAR_security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply tfplan

      - name: Update CloudFront distribution ID in config
        run: |
          CF_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          if [ -n "$CF_ID" ]; then
            sed -i "s|distribution_id:.*|distribution_id: ${CF_ID}|" .github/config/env.yml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/config/env.yml
            git diff --staged --quiet || git commit -m "ci(infra): update CloudFront distribution ID"
            git push
            echo "✅ Updated CloudFront distribution ID: $CF_ID"
          fi

      - name: Setup kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ steps.config.outputs.aws_region }} \
            --name ${{ steps.config.outputs.project_name }}

      # Chờ ArgoCD sync Ingress → ALB Controller tạo ALB → lấy DNS → update CloudFront origin
      - name: Update CloudFront origin with ALB DNS
        run: |
          echo "Waiting for ALB to be provisioned by ALB Controller..."
          for i in $(seq 1 30); do
            ALB_DNS=$(kubectl get ingress -A \
              -l "ingress.k8s.aws/stack=eventfund-shared" \
              -o jsonpath="{.items[0].status.loadBalancer.ingress[0].hostname}" 2>/dev/null || echo "")
            if [ -n "$ALB_DNS" ]; then
              echo "✅ ALB DNS: $ALB_DNS"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

          if [ -z "$ALB_DNS" ]; then
            echo "⚠️ ALB not ready yet, skipping CloudFront update"
            exit 0
          fi

          CF_ID=$(terraform -chdir=terraform output -raw cloudfront_distribution_id)
          ETAG=$(aws cloudfront get-distribution-config --id "$CF_ID" --query 'ETag' --output text)

          # Lấy config hiện tại và thêm ALB origin
          aws cloudfront get-distribution-config --id "$CF_ID" \
            --query 'DistributionConfig' --output json > /tmp/cf-config.json

          # Thêm ALB origin nếu chưa có
          python3 - <<EOF
          import json, sys

          with open('/tmp/cf-config.json') as f:
              config = json.load(f)

          alb_dns = "$ALB_DNS"
          origin_id = "alb-internal"

          # Kiểm tra origin đã tồn tại chưa
          existing = [o for o in config['Origins']['Items'] if o['Id'] == origin_id]
          if not existing:
              config['Origins']['Items'].append({
                  "Id": origin_id,
                  "DomainName": alb_dns,
                  "CustomOriginConfig": {
                      "HTTPPort": 80,
                      "HTTPSPort": 443,
                      "OriginProtocolPolicy": "http-only",
                      "OriginSSLProtocols": {"Quantity": 1, "Items": ["TLSv1.2"]},
                      "OriginReadTimeout": 30,
                      "OriginKeepaliveTimeout": 5
                  },
                  "ConnectionAttempts": 3,
                  "ConnectionTimeout": 10
              })
              config['Origins']['Quantity'] = len(config['Origins']['Items'])
          else:
              # Update DNS nếu ALB đã thay đổi
              for o in config['Origins']['Items']:
                  if o['Id'] == origin_id:
                      o['DomainName'] = alb_dns

          # Thêm cache behaviors cho /argocd/* và /grafana/*
          behaviors = config.get('CacheBehaviors', {}).get('Items', [])
          for path, origin in [('/argocd/*', origin_id), ('/grafana/*', origin_id)]:
              if not any(b['PathPattern'] == path for b in behaviors):
                  behaviors.append({
                      "PathPattern": path,
                      "TargetOriginId": origin_id,
                      "ViewerProtocolPolicy": "redirect-to-https",
                      "AllowedMethods": {"Quantity": 7, "Items": ["GET","HEAD","OPTIONS","PUT","POST","PATCH","DELETE"], "CachedMethods": {"Quantity": 2, "Items": ["GET","HEAD"]}},
                      "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",  # CachingDisabled
                      "OriginRequestPolicyId": "216adef6-5c7f-47e4-b989-5492eafa07d3",  # AllViewer
                      "Compress": True
                  })
          config['CacheBehaviors'] = {'Quantity': len(behaviors), 'Items': behaviors}

          with open('/tmp/cf-config-updated.json', 'w') as f:
              json.dump(config, f)
          print("✅ CloudFront config updated")
          EOF

          aws cloudfront update-distribution \
            --id "$CF_ID" \
            --distribution-config file:///tmp/cf-config-updated.json \
            --if-match "$ETAG"
          echo "✅ CloudFront updated with ALB origin: $ALB_DNS"

      - name: Render alertmanager config with secrets
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
        run: |
          if [ -n "$ALERT_EMAIL" ] && [ -n "$ALERT_EMAIL_PASSWORD" ]; then
            aws eks update-kubeconfig \
              --region ${{ steps.config.outputs.aws_region }} \
              --name ${{ steps.config.outputs.project_name }}
            export ALERT_EMAIL ALERT_EMAIL_PASSWORD
            envsubst < k8s/base/monitoring/alertmanager-config.yaml | kubectl apply -f -
            echo "✅ Alertmanager config applied"
          else
            echo "⚠️ ALERT_EMAIL or ALERT_EMAIL_PASSWORD not set, skipping alertmanager config"
          fi
