name: Deploy App (EC2)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      S3_BUCKET: eventfund-deploy-tmp-${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Create S3 temp bucket if not exists
        run: |
          aws s3 mb s3://$S3_BUCKET --region $AWS_REGION 2>/dev/null || true

      # Build and deploy backend
      - name: Build backend Docker image
        run: |
          docker build -t eventfund-backend:latest --target production .
          docker save eventfund-backend:latest | gzip > /tmp/backend.tar.gz

      - name: Upload backend image to S3
        run: aws s3 cp /tmp/backend.tar.gz s3://$S3_BUCKET/backend.tar.gz

      - name: Clone or update repo on EC2
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-id $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"if [ ! -d /app/repo/.git ]; then git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git /app/repo; else cd /app/repo && git fetch origin && git reset --hard origin/${{ github.ref_name }}; fi\"]" \
            --region $AWS_REGION \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"
          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query "Status" --output text)
            echo "Status ($i/18): $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 10
          done

      - name: Deploy backend on EC2
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-id $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws s3 cp s3://$S3_BUCKET/backend.tar.gz /tmp/backend.tar.gz --region $AWS_REGION\",
              \"docker load < /tmp/backend.tar.gz\",
              \"rm /tmp/backend.tar.gz\",
              \"cd /app && docker compose up -d api\"
            ]" \
            --region $AWS_REGION \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query "Status" --output text)
            echo "Status ($i/30): $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query "{Output:StandardOutputContent,Error:StandardErrorContent}" --output json
              exit 1
            fi
            sleep 10
          done

      # Build and deploy frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_API_BASE_URL: "/api"
          VITE_WEB3AUTH_CLIENT_ID: ${{ secrets.VITE_WEB3AUTH_CLIENT_ID }}
          VITE_WEB3AUTH_NETWORK: ${{ secrets.VITE_WEB3AUTH_NETWORK }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_CHAIN_ID: ${{ secrets.VITE_CHAIN_ID }}
          VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL }}
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          tar -czf /tmp/frontend.tar.gz -C frontend/dist .

      - name: Upload frontend to S3
        run: aws s3 cp /tmp/frontend.tar.gz s3://$S3_BUCKET/frontend.tar.gz

      - name: Deploy frontend on EC2
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-id $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws s3 cp s3://$S3_BUCKET/frontend.tar.gz /tmp/frontend.tar.gz --region $AWS_REGION\",
              \"rm -rf /app/frontend-dist/* && tar -xzf /tmp/frontend.tar.gz -C /app/frontend-dist\",
              \"rm /tmp/frontend.tar.gz\",
              \"cd /app && docker compose up -d frontend ngrok\"
            ]" \
            --region $AWS_REGION \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"
          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query "Status" --output text)
            echo "Status ($i/18): $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 10
          done

      - name: Cleanup S3
        run: |
          aws s3 rm s3://$S3_BUCKET/backend.tar.gz 2>/dev/null || true
          aws s3 rm s3://$S3_BUCKET/frontend.tar.gz 2>/dev/null || true
