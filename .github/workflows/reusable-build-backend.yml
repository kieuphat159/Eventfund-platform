name: Reusable – Backend

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment (dev or prod)'
        type: string
        default: 'dev'
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      RPC_URL:
        required: false

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Load config
        id: config
        uses: ./.github/actions/load-config
        with:
          environment: ${{ inputs.environment }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build và load vào local daemon để smoke test dùng ngay
      # Không push ở bước này — push riêng sau khi test pass
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.config.outputs.ecr_backend_repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test dùng image local — không cần pull từ ECR
      - name: Smoke test (/health)
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ steps.login-ecr.outputs.registry }}/${{ steps.config.outputs.ecr_backend_repository }}:${{ github.sha }}"
          ENVIRONMENT="${{ inputs.environment }}"
          
          # Pull env vars từ SSM, ghi vào temp file để inject vào container
          # Dùng env-file thay vì -e flag để handle values có spaces/ký tự đặc biệt
          ENV_FILE=$(mktemp)
          trap "rm -f $ENV_FILE" EXIT  # đảm bảo xóa file dù exit thế nào

          echo "📥 Pulling env vars from SSM: /eventfund/${ENVIRONMENT}/backend"

          aws ssm get-parameters-by-path \
            --path "/eventfund/${ENVIRONMENT}/backend" \
            --recursive \
            --with-decryption \
            --region ${{ steps.config.outputs.aws_region }} \
            --query 'Parameters[*].[Name,Value]' \
            --output json | \
          jq -r '.[] | (.[0] | split("/") | last) + "=" + .[1]' > "$ENV_FILE"

          docker run -d \
            --name backend-test \
            -p 4000:4000 \
            --env-file "$ENV_FILE" \
            "$IMAGE_TAG"

          for i in {1..60}; do
            if curl -fsS "http://localhost:4000/health" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "✅ Health check passed"
              docker stop backend-test
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 3
          done

          echo "❌ Health check failed"
          docker logs --tail 100 backend-test
          docker stop backend-test
          exit 1

      # Push lên ECR chỉ khi là push event (không phải PR)
      # Chạy sau khi smoke test pass
      # Dùng docker/build-push-action để push multiple tags cùng lúc
      - name: Push image to ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.config.outputs.ecr_backend_repository }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.config.outputs.ecr_backend_repository }}:latest
          cache-from: type=gha

      # Add Trivy DB cache for faster scans
      - name: Cache Trivy DB
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # Trivy scan — chạy trên image local, không cần pull từ ECR
      # Pin to commit hash for security and reproducibility
      - name: Run Trivy security scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ steps.config.outputs.ecr_backend_repository }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
        env:
          TRIVY_NO_PROGRESS: 'true'

      - name: Upload Trivy SARIF to GitHub Security
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
