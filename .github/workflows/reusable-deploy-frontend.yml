name: Reusable – Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment (dev or prod)'
        type: string
        default: 'dev'
    secrets:
      AWS_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Configure AWS
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Pull frontend env from SSM
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment }}"
          SSM_PREFIX="/eventfund/${ENVIRONMENT}/frontend"
          ENV_FILE="frontend/.env"
          
          echo "📥 Pulling frontend env from: $SSM_PREFIX"
          
          aws ssm get-parameters-by-path \
            --path "$SSM_PREFIX" \
            --recursive \
            --with-decryption \
            --region ${{ steps.config.outputs.aws_region }} \
            --query 'Parameters[*].[Name,Value]' \
            --output json > /tmp/ssm.json
          jq -r '.[] | @tsv' /tmp/ssm.json > /tmp/ssm.tsv
          while IFS=$(printf '\t') read -r name value; do
            KEY=$(echo "$name" | sed "s|^$SSM_PREFIX/||")
            echo "${KEY}=${value}" >> "$ENV_FILE"
          done < /tmp/ssm.tsv
          rm -f /tmp/ssm.json /tmp/ssm.tsv
          
          echo "✅ Frontend env loaded"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload to S3
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          
          # Determine S3 bucket based on environment
          if [ "$ENVIRONMENT" = "prod" ]; then
            S3_BUCKET="eventfund-frontend-prod"
          else
            S3_BUCKET="eventfund-frontend-dev"
          fi
          
          echo "📤 Uploading to S3 bucket: $S3_BUCKET (environment: $ENVIRONMENT)"
          
          aws s3 sync frontend/dist/ s3://${S3_BUCKET} \
            --delete \
            --region ${{ steps.config.outputs.aws_region }}
          
          echo "✅ Uploaded to s3://${S3_BUCKET}"

      - name: Invalidate CloudFront cache
        run: |
          # Auto-query CloudFront distribution ID by S3 bucket origin
          BUCKET="${{ steps.config.outputs.frontend_s3_bucket }}"
          REGION="${{ steps.config.outputs.aws_region }}"

          # Query tất cả distributions và filter bằng jq để tìm origin chứa bucket name
          DIST_ID=$(aws cloudfront list-distributions --output json | \
            jq -r ".DistributionList.Items[] | select(.Origins.Items[].DomainName | contains(\"${BUCKET}\")) | .Id" | \
            head -n 1)

          if [ -z "$DIST_ID" ]; then
            echo " CloudFront distribution not found for bucket: ${BUCKET}"
            echo "Available distributions:"
            aws cloudfront list-distributions --query "DistributionList.Items[].{Id:Id, Origins:Origins.Items[*].DomainName}" --output json
            exit 1
          fi

          echo " Found distribution: $DIST_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
