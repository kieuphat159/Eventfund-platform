name: Manual – Infrastructure Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string
      destroy_vpc:
        description: 'Also destroy VPC + NAT Gateway?'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      aws_region:                      ${{ steps.config.outputs.aws_region }}
      project_name:                    ${{ steps.config.outputs.project_name }}
      environment:                     ${{ steps.config.outputs.environment }}
      terraform_version:               ${{ steps.config.outputs.terraform_version }}
      tf_eks_version:                  ${{ steps.config.outputs.tf_eks_version }}
      tf_node_instance_type:           ${{ steps.config.outputs.tf_node_instance_type }}
      tf_node_desired_capacity:        ${{ steps.config.outputs.tf_node_desired_capacity }}
      tf_node_min_capacity:            ${{ steps.config.outputs.tf_node_min_capacity }}
      tf_node_max_capacity:            ${{ steps.config.outputs.tf_node_max_capacity }}
      tf_vpc_cidr:                     ${{ steps.config.outputs.tf_vpc_cidr }}
      tf_public_subnets_cidr:          ${{ steps.config.outputs.tf_public_subnets_cidr }}
      tf_private_subnets_cidr:         ${{ steps.config.outputs.tf_private_subnets_cidr }}
      tf_azs:                          ${{ steps.config.outputs.tf_azs }}
      ecr_backend_repository:          ${{ steps.config.outputs.ecr_backend_repository }}
      github_actions_role_name:        ${{ steps.config.outputs.github_actions_role_name }}
      s3_security_reports_bucket:      ${{ steps.config.outputs.s3_security_reports_bucket }}
      security_reports_retention_days: ${{ steps.config.outputs.security_reports_retention_days }}
      argocd_repo_url:                 ${{ steps.config.outputs.argocd_repo_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

  destroy:
    name: Destroy Billable AWS Resources
    runs-on: ubuntu-latest
    needs: setup
    if: github.event.inputs.confirm == 'destroy'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-aws
        with:
          aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}

      # ─── Step 1: Destroy Services (Helm releases) ────────────────────────────
      - name: "[1/3] Destroy Services (Helm releases)"
        id: destroy_services
        working-directory: terraform/services
        run: |
          terraform init
          terraform destroy -auto-approve
        continue-on-error: false

      - name: Wait for ALB cleanup
        run: |
          echo "Waiting 30s for ALB Controller to cleanup ALBs/ENIs..."
          sleep 30

      # ─── Step 2: Destroy Cluster (EKS + NAT Gateway) ─────────────────────────
      - name: "[2/3] Destroy Cluster (EKS + NAT Gateway)"
        id: destroy_cluster
        working-directory: terraform/cluster
        run: |
          terraform init
          terraform destroy -auto-approve
        continue-on-error: false

      # ─── Step 3: Destroy Persistent (Optional - VPC only if requested) ───────
      - name: "[3/3] Destroy VPC (Optional)"
        id: destroy_vpc
        if: github.event.inputs.destroy_vpc == 'yes'
        working-directory: terraform/persistent
        run: |
          terraform init
          
          # Only destroy VPC, keep ECR, S3, CloudFront, IAM
          terraform destroy \
            -target=module.vpc \
            -auto-approve

      - name: Summary
        if: always()
        run: |
          echo "## Destroy Report (Multi-State)" >> $GITHUB_STEP_SUMMARY
          echo "| State | Status | Saving |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          [[ "${{ steps.destroy_services.outcome }}" == "success" ]] \
            && echo "| Services (Helm, ArgoCD, Prometheus) | ✅ Destroyed | ~\$0.02/hr |" >> $GITHUB_STEP_SUMMARY \
            || echo "| Services (Helm, ArgoCD, Prometheus) | ❌ Failed | – |" >> $GITHUB_STEP_SUMMARY

          [[ "${{ steps.destroy_cluster.outcome }}" == "success" ]] \
            && echo "| Cluster (EKS, Node Group, NAT) | ✅ Destroyed | ~\$0.32/hr |" >> $GITHUB_STEP_SUMMARY \
            || echo "| Cluster (EKS, Node Group, NAT) | ❌ Failed | – |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event.inputs.destroy_vpc }}" == "yes" ]]; then
            [[ "${{ steps.destroy_vpc.outcome }}" == "success" ]] \
              && echo "| VPC | ✅ Destroyed | \$0 (free) |" >> $GITHUB_STEP_SUMMARY \
              || echo "| VPC | ❌ Failed | – |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| VPC | ⏭️ Kept | \$0 (free) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Persistent resources kept:** ECR, S3, CloudFront, GitHub OIDC, IAM (~\$1.50/month)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total savings:** ~\$252/month" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To redeploy:**" >> $GITHUB_STEP_SUMMARY
          echo "1. \`cd terraform/cluster && terraform apply\`" >> $GITHUB_STEP_SUMMARY
          echo "2. \`cd terraform/services && terraform apply\`" >> $GITHUB_STEP_SUMMARY
