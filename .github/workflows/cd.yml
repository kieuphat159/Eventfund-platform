name: CD

on:
  # Trigger sau khi CI pass trên main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, dev]
  # Cho phép trigger thủ công
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest commit SHA)'
        required: false
      deploy_backend:
        description: 'Deploy backend?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      deploy_frontend:
        description: 'Deploy frontend?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # Không cancel deploy đang chạy

jobs:
  # Kiểm tra CI result và detect files changed trong commit đó
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      image_tag:     ${{ steps.check.outputs.image_tag }}
      environment:   ${{ steps.determine_env.outputs.environment }}
      backend:       ${{ steps.changes.outputs.backend }}
      frontend:      ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Check if should deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "image_tag=${TAG:-${{ github.sha }}}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "image_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment from branch
        id: determine_env
        run: |
          BRANCH="${{ github.ref_name }}"
          
          if [ "$BRANCH" = "master" ]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi
          
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "✅ Determined environment: ${ENVIRONMENT} (branch: ${BRANCH})"

      # Checkout tại commit SHA của CI run (workflow_run) hoặc HEAD (workflow_dispatch)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: changes
        with:
          # workflow_dispatch: deploy cả hai theo input; workflow_run: detect từ diff
          base: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      # Override changes với manual input khi workflow_dispatch
      - name: Override changes for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "backend=${{ github.event.inputs.deploy_backend }}"   >> $GITHUB_OUTPUT
          echo "frontend=${{ github.event.inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
        id: override

  deploy-backend:
    needs: check
    if: |
      needs.check.outputs.should_deploy == 'true' &&
      needs.check.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-deploy-backend.yml
    permissions:
      contents: write
      id-token: write
    with:
      image_tag: ${{ needs.check.outputs.image_tag }}
      environment: ${{ needs.check.outputs.environment }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  deploy-frontend:
    needs: check
    if: |
      needs.check.outputs.should_deploy == 'true' &&
      needs.check.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-deploy-frontend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
