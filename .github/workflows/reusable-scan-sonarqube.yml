name: Reusable – SonarQube Scan

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name for conditional quality gate check'
        type: string
        required: false
        default: ''
      scan_mode:
        description: 'Scan mode: pr (changed files only) or full (entire project)'
        type: string
        required: false
        default: 'pr'
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: false

jobs:
  sonarqube-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          persist-credentials: false

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      # Determine Sonar server URL
      - name: Set Sonar server URL
        id: sonar_url
        shell: bash
        run: |
          URL="${{ secrets.SONAR_HOST_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ steps.config.outputs.sonarcloud_base_url }}"
          fi
          echo "url=${URL}" >> $GITHUB_OUTPUT

      # Run SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar_url.outputs.url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.config.outputs.sonarcloud_project_key }}
            -Dsonar.organization=${{ steps.config.outputs.sonarcloud_organization }}
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
            ${{ inputs.scan_mode == 'pr' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.run_number, github.ref_name, github.event.repository.default_branch) || '' }}

      # Quality gate check (only on master branch with full scan)
      - name: SonarQube Quality Gate check
        if: inputs.branch == 'master' && inputs.scan_mode == 'full'
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar_url.outputs.url }}

      # Upload scan metadata as artifact for debugging
      - name: Upload scan metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-scan-metadata-${{ github.run_id }}
          path: .scannerwork/report-task.txt
          if-no-files-found: ignore
          retention-days: 7
