# Centralized Configuration for GitHub Actions
# This file contains all hardcoded values used across workflows

aws:
  region: ap-southeast-1
  oidc_role_name: GitHubActionsRole
  account_id_secret: AWS_ACCOUNT_ID  # Secret name in GitHub

ecr:
  backend_repository: eventfund-backend

s3:
  security_reports_bucket: eventfund-security-reports
  deploy_tmp_bucket_prefix: eventfund-deploy-tmp

sonarcloud:
  project_key: truongtrongdat94_eventfund-platform
  organization: truongtrongdat94
  base_url: https://sonarcloud.io

node:
  version: "20.19.0"

docker:
  buildx_version: v0.12.0

timeouts:
  health_check_seconds: 180
  health_check_retries: 60
  deploy_wait_seconds: 300
  deploy_wait_retries: 30

security_scans:
  trivy:
    severity: "CRITICAL,HIGH"
    format: "sarif"
  owasp:
    format: "HTML,JSON,XML"
    retention_days: 30
  sonarqube:
    retention_days: 30
