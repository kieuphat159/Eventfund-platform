name: Update CloudFront Origin
description: Update CloudFront distribution with ALB origin from EKS Ingress

inputs:
  aws_region:
    description: 'AWS region'
    required: true
  project_name:
    description: 'Project name for EKS cluster'
    required: true
  cloudfront_dev_distribution_id:
    description: 'CloudFront Dev distribution ID'
    required: true
  cloudfront_prod_distribution_id:
    description: 'CloudFront Prod distribution ID'
    required: true
  ingress_group_name:
    description: 'ALB Ingress group name'
    required: false
    default: 'eventfund-shared'
  origin_id:
    description: 'CloudFront origin ID'
    required: false
    default: 'alb-internal'
  timeout_minutes:
    description: 'Timeout in minutes to wait for Ingress'
    required: false
    default: '5'

outputs:
  alb_dns:
    description: 'ALB DNS name'
    value: ${{ steps.get-alb.outputs.alb_dns }}
  cloudfront_dev_distribution_id:
    description: 'CloudFront Dev distribution ID'
    value: ${{ steps.get-cf.outputs.dev_distribution_id }}
  cloudfront_prod_distribution_id:
    description: 'CloudFront Prod distribution ID'
    value: ${{ steps.get-cf.outputs.prod_distribution_id }}

runs:
  using: composite
  steps:
    - name: Wait for Ingress resources
      id: get-alb
      shell: bash
      run: |
        echo "Waiting for Ingress resources to be synced by ArgoCD..."
        
        TIMEOUT_MINUTES=${{ inputs.timeout_minutes }}
        MAX_ITERATIONS=$((TIMEOUT_MINUTES * 6))  # Check every 10 seconds
        
        for i in $(seq 1 $MAX_ITERATIONS); do
          # Count Ingress with specified group name
          INGRESS_COUNT=$(kubectl get ingress -A \
            -o json 2>/dev/null | jq -r "[.items[] | select(.metadata.annotations.\"alb.ingress.kubernetes.io/group.name\" == \"${{ inputs.ingress_group_name }}\")] | length" || echo "0")
          
          if [ "$INGRESS_COUNT" -gt 0 ]; then
            echo "✅ Found $INGRESS_COUNT Ingress resource(s) with group.name=${{ inputs.ingress_group_name }}"
            
            # Get ALB DNS from first Ingress (all Ingress in same group share one ALB)
            ALB_DNS=$(kubectl get ingress -A \
              -o json 2>/dev/null | jq -r "[.items[] | select(.metadata.annotations.\"alb.ingress.kubernetes.io/group.name\" == \"${{ inputs.ingress_group_name }}\")] | .[0].status.loadBalancer.ingress[0].hostname" || echo "")
            
            if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "null" ]; then
              echo "✅ ALB DNS: $ALB_DNS"
              echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Ingress exists but ALB not provisioned yet, waiting..."
            fi
          else
            echo "Waiting for ArgoCD to sync Ingress... ($i/$MAX_ITERATIONS)"
          fi
          
          sleep 10
        done

        echo "❌ Could not get ALB DNS after $TIMEOUT_MINUTES minutes"
        echo ""
        echo "Current Ingress resources:"
        kubectl get ingress -A 2>/dev/null || echo "No Ingress resources found"
        echo ""
        echo "You can manually update CloudFront later with:"
        echo "  kubectl get ingress -A"
        echo "  ALB_DNS=\$(kubectl get ingress -n eventfund-dev api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
        exit 1

    - name: Update CloudFront distributions (Dev + Prod)
      shell: bash
      env:
        ALB_DNS: ${{ steps.get-alb.outputs.alb_dns }}
        ORIGIN_ID: ${{ inputs.origin_id }}
        CF_DEV_ID: ${{ inputs.cloudfront_dev_distribution_id }}
        CF_PROD_ID: ${{ inputs.cloudfront_prod_distribution_id }}
      run: |
        echo "CloudFront Dev ID: $CF_DEV_ID"
        echo "CloudFront Prod ID: $CF_PROD_ID"
        
        # Function to update a CloudFront distribution
        update_cloudfront() {
          local CF_ID=$1
          local ENV_NAME=$2
          
          echo "Updating CloudFront $ENV_NAME ($CF_ID)..."
          
          # Get current distribution config
          aws cloudfront get-distribution-config --id "$CF_ID" --output json > /tmp/cf-full-${ENV_NAME}.json
          ETAG=$(jq -r '.ETag' /tmp/cf-full-${ENV_NAME}.json)
          jq '.DistributionConfig' /tmp/cf-full-${ENV_NAME}.json > /tmp/cf-config-${ENV_NAME}.json
          
          # Check if origin exists, if yes update DomainName, if no add new origin
          ORIGIN_EXISTS=$(jq --arg id "$ORIGIN_ID" '.Origins.Items | any(.Id == $id)' /tmp/cf-config-${ENV_NAME}.json)
          
          if [ "$ORIGIN_EXISTS" = "true" ]; then
            echo "Updating existing origin: $ORIGIN_ID"
            jq --arg id "$ORIGIN_ID" --arg dns "$ALB_DNS" \
              '(.Origins.Items[] | select(.Id == $id) | .DomainName) = $dns' \
              /tmp/cf-config-${ENV_NAME}.json > /tmp/cf-config-${ENV_NAME}-updated.json
          else
            echo "Adding new origin: $ORIGIN_ID"
            jq --arg id "$ORIGIN_ID" --arg dns "$ALB_DNS" \
              '.Origins.Items += [{
                "Id": $id,
                "DomainName": $dns,
                "OriginPath": "",
                "CustomHeaders": {"Quantity": 0, "Items": []},
                "CustomOriginConfig": {
                  "HTTPPort": 80,
                  "HTTPSPort": 443,
                  "OriginProtocolPolicy": "http-only",
                  "OriginSslProtocols": {"Quantity": 1, "Items": ["TLSv1.2"]},
                  "OriginReadTimeout": 30,
                  "OriginKeepaliveTimeout": 5
                },
                "ConnectionAttempts": 3,
                "ConnectionTimeout": 10,
                "OriginShield": {"Enabled": false}
              }] | .Origins.Quantity = (.Origins.Items | length)' \
              /tmp/cf-config-${ENV_NAME}.json > /tmp/cf-config-${ENV_NAME}-updated.json
          fi
          
          # Add cache behaviors if not exist
          for path in "/argocd/*" "/grafana/*" "/api/*"; do
            BEHAVIOR_EXISTS=$(jq --arg path "$path" '.CacheBehaviors.Items // [] | any(.PathPattern == $path)' /tmp/cf-config-${ENV_NAME}-updated.json)
            if [ "$BEHAVIOR_EXISTS" = "false" ]; then
              echo "Adding cache behavior: $path"
              jq --arg path "$path" --arg id "$ORIGIN_ID" \
                '.CacheBehaviors.Items += [{
                  "PathPattern": $path,
                  "TargetOriginId": $id,
                  "ViewerProtocolPolicy": "redirect-to-https",
                  "TrustedSigners": {"Enabled": false, "Quantity": 0},
                  "TrustedKeyGroups": {"Enabled": false, "Quantity": 0},
                  "AllowedMethods": {
                    "Quantity": 7,
                    "Items": ["GET","HEAD","OPTIONS","PUT","POST","PATCH","DELETE"],
                    "CachedMethods": {"Quantity": 2, "Items": ["GET","HEAD"]}
                  },
                  "SmoothStreaming": false,
                  "Compress": true,
                  "LambdaFunctionAssociations": {"Quantity": 0},
                  "FunctionAssociations": {"Quantity": 0},
                  "FieldLevelEncryptionId": "",
                  "RealtimeLogConfigArn": "",
                  "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",
                  "OriginRequestPolicyId": "216adef6-5c7f-47e4-b989-5492eafa07d3"
                }] | .CacheBehaviors.Quantity = (.CacheBehaviors.Items | length)' \
                /tmp/cf-config-${ENV_NAME}-updated.json > /tmp/cf-config-${ENV_NAME}-temp.json
              mv /tmp/cf-config-${ENV_NAME}-temp.json /tmp/cf-config-${ENV_NAME}-updated.json
            fi
          done
          
          # Apply updated config
          aws cloudfront update-distribution \
            --id "$CF_ID" \
            --distribution-config file:///tmp/cf-config-${ENV_NAME}-updated.json \
            --if-match "$ETAG" \
            --region us-east-1 > /dev/null
          
          echo "✅ CloudFront $ENV_NAME updated with ALB origin: $ALB_DNS"
        }
        
        # Update both dev and prod CloudFront distributions
        update_cloudfront "$CF_DEV_ID" "dev"
        update_cloudfront "$CF_PROD_ID" "prod"
        
        echo ""
        echo "✅ Both CloudFront distributions updated successfully"
