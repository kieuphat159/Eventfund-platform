name: Update CloudFront Origin
description: Update CloudFront distribution with ALB origin from EKS Ingress

inputs:
  aws_region:
    description: 'AWS region'
    required: true
  project_name:
    description: 'Project name for EKS cluster'
    required: true
  ingress_group_name:
    description: 'ALB Ingress group name'
    required: false
    default: 'eventfund-shared'
  origin_id:
    description: 'CloudFront origin ID'
    required: false
    default: 'alb-internal'
  timeout_minutes:
    description: 'Timeout in minutes to wait for Ingress'
    required: false
    default: '5'

outputs:
  alb_dns:
    description: 'ALB DNS name'
    value: ${{ steps.get-alb.outputs.alb_dns }}
  cloudfront_dev_distribution_id:
    description: 'CloudFront Dev distribution ID'
    value: ${{ steps.get-cf.outputs.dev_distribution_id }}
  cloudfront_prod_distribution_id:
    description: 'CloudFront Prod distribution ID'
    value: ${{ steps.get-cf.outputs.prod_distribution_id }}

runs:
  using: composite
  steps:
    - name: Wait for Ingress resources
      id: get-alb
      shell: bash
      run: |
        echo "Waiting for Ingress resources to be synced by ArgoCD..."
        
        TIMEOUT_MINUTES=${{ inputs.timeout_minutes }}
        MAX_ITERATIONS=$((TIMEOUT_MINUTES * 6))  # Check every 10 seconds
        
        for i in $(seq 1 $MAX_ITERATIONS); do
          # Count Ingress with specified group name
          INGRESS_COUNT=$(kubectl get ingress -A \
            -o json 2>/dev/null | jq -r "[.items[] | select(.metadata.annotations.\"alb.ingress.kubernetes.io/group.name\" == \"${{ inputs.ingress_group_name }}\")] | length" || echo "0")
          
          if [ "$INGRESS_COUNT" -gt 0 ]; then
            echo "✅ Found $INGRESS_COUNT Ingress resource(s) with group.name=${{ inputs.ingress_group_name }}"
            
            # Get ALB DNS from first Ingress (all Ingress in same group share one ALB)
            ALB_DNS=$(kubectl get ingress -A \
              -o json 2>/dev/null | jq -r "[.items[] | select(.metadata.annotations.\"alb.ingress.kubernetes.io/group.name\" == \"${{ inputs.ingress_group_name }}\")] | .[0].status.loadBalancer.ingress[0].hostname" || echo "")
            
            if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "null" ]; then
              echo "✅ ALB DNS: $ALB_DNS"
              echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Ingress exists but ALB not provisioned yet, waiting..."
            fi
          else
            echo "Waiting for ArgoCD to sync Ingress... ($i/$MAX_ITERATIONS)"
          fi
          
          sleep 10
        done

        echo "❌ Could not get ALB DNS after $TIMEOUT_MINUTES minutes"
        echo ""
        echo "Current Ingress resources:"
        kubectl get ingress -A 2>/dev/null || echo "No Ingress resources found"
        echo ""
        echo "You can manually update CloudFront later with:"
        echo "  kubectl get ingress -A"
        echo "  ALB_DNS=\$(kubectl get ingress -n eventfund-dev api-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
        exit 1

    - name: Get CloudFront distribution IDs
      id: get-cf
      shell: bash
      run: |
        # Get both dev and prod CloudFront distribution IDs
        CF_DEV_ID=$(terraform -chdir=terraform/persistent output -raw cloudfront_dev_distribution_id 2>/dev/null || echo "")
        CF_PROD_ID=$(terraform -chdir=terraform/persistent output -raw cloudfront_prod_distribution_id 2>/dev/null || echo "")
        
        if [ -z "$CF_DEV_ID" ] || [ -z "$CF_PROD_ID" ]; then
          echo "❌ Could not get CloudFront distribution IDs from Terraform output"
          echo "Dev ID: $CF_DEV_ID"
          echo "Prod ID: $CF_PROD_ID"
          exit 1
        fi
        
        echo "dev_distribution_id=$CF_DEV_ID" >> $GITHUB_OUTPUT
        echo "prod_distribution_id=$CF_PROD_ID" >> $GITHUB_OUTPUT
        echo "✅ CloudFront Dev distribution ID: $CF_DEV_ID"
        echo "✅ CloudFront Prod distribution ID: $CF_PROD_ID"

    - name: Update CloudFront distributions (Dev + Prod)
      shell: bash
      env:
        ALB_DNS: ${{ steps.get-alb.outputs.alb_dns }}
        ORIGIN_ID: ${{ inputs.origin_id }}
      run: |
        CF_DEV_ID="${{ steps.get-cf.outputs.dev_distribution_id }}"
        CF_PROD_ID="${{ steps.get-cf.outputs.prod_distribution_id }}"
        
        # Function to update a CloudFront distribution
        update_cloudfront() {
          local CF_ID=$1
          local ENV_NAME=$2
          
          echo "Updating CloudFront $ENV_NAME ($CF_ID)..."
          
          # Get current distribution config
          ETAG=$(aws cloudfront get-distribution-config --id "$CF_ID" --query 'ETag' --output text)
          aws cloudfront get-distribution-config --id "$CF_ID" \
            --query 'DistributionConfig' --output json > /tmp/cf-config-${ENV_NAME}.json

          # Update config using Python
          python3 -c 'import json; import os; env_name = os.environ["ENV_NAME"]; config = json.load(open(f"/tmp/cf-config-{env_name}.json")); alb_dns = os.environ["ALB_DNS"]; origin_id = os.environ["ORIGIN_ID"]; existing = [o for o in config["Origins"]["Items"] if o["Id"] == origin_id]; config["Origins"]["Items"].append({"Id": origin_id, "DomainName": alb_dns, "CustomOriginConfig": {"HTTPPort": 80, "HTTPSPort": 443, "OriginProtocolPolicy": "http-only", "OriginSslProtocols": {"Quantity": 1, "Items": ["TLSv1.2"]}, "OriginReadTimeout": 30, "OriginKeepaliveTimeout": 5}, "ConnectionAttempts": 3, "ConnectionTimeout": 10}) if not existing else None; config["Origins"]["Quantity"] = len(config["Origins"]["Items"]) if not existing else config["Origins"]["Quantity"]; [o.update({"DomainName": alb_dns}) for o in config["Origins"]["Items"] if o["Id"] == origin_id] if existing else None; print(f"Added new origin: {origin_id}") if not existing else print(f"Updated origin DNS: {origin_id} -> {alb_dns}"); behaviors = config.get("CacheBehaviors", {}).get("Items", []); [behaviors.append({"PathPattern": path, "TargetOriginId": target_origin, "ViewerProtocolPolicy": "redirect-to-https", "AllowedMethods": {"Quantity": 7, "Items": ["GET", "HEAD", "OPTIONS", "PUT", "POST", "PATCH", "DELETE"], "CachedMethods": {"Quantity": 2, "Items": ["GET", "HEAD"]}}, "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad", "OriginRequestPolicyId": "216adef6-5c7f-47e4-b989-5492eafa07d3", "Compress": True}) or print(f"Added cache behavior: {path}") for path, target_origin in [("/argocd/*", origin_id), ("/grafana/*", origin_id), ("/api/*", origin_id)] if not any(b["PathPattern"] == path for b in behaviors)]; config.update({"CacheBehaviors": {"Quantity": len(behaviors), "Items": behaviors}}); json.dump(config, open(f"/tmp/cf-config-{env_name}-updated.json", "w"), indent=2); print(f"CloudFront {env_name} config updated")'
          
          # Apply updated config
          aws cloudfront update-distribution \
            --id "$CF_ID" \
            --distribution-config file:///tmp/cf-config-${ENV_NAME}-updated.json \
            --if-match "$ETAG" \
            --region us-east-1
          
          echo "✅ CloudFront $ENV_NAME updated with ALB origin: $ALB_DNS"
        }
        
        # Update both dev and prod CloudFront distributions
        export ALB_DNS ORIGIN_ID
        
        export ENV_NAME="dev"
        update_cloudfront "$CF_DEV_ID" "dev"
        
        export ENV_NAME="prod"
        update_cloudfront "$CF_PROD_ID" "prod"
        
        echo ""
        echo "✅ Both CloudFront distributions updated successfully"
