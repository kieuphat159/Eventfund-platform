name: Generate Scan Metadata
description: Generate unique scan ID and metadata.json for security scans

inputs:
  tool:
    description: 'Tool name (owasp-dependency-check, sonarqube, trivy)'
    required: true
  project:
    description: 'Project name'
    required: false
    default: 'eventfund-platform'

outputs:
  scan_id:
    description: 'Unique scan ID'
    value: ${{ steps.generate.outputs.scan_id }}
  timestamp:
    description: 'ISO 8601 timestamp'
    value: ${{ steps.generate.outputs.timestamp }}
  short_sha:
    description: 'Short commit SHA (7 chars)'
    value: ${{ steps.generate.outputs.short_sha }}
  branch_name:
    description: 'Sanitized branch name'
    value: ${{ steps.generate.outputs.branch_name }}
  s3_path:
    description: 'S3 path for this scan'
    value: ${{ steps.generate.outputs.s3_path }}
  metadata_file:
    description: 'Path to generated metadata.json'
    value: ${{ steps.generate.outputs.metadata_file }}

runs:
  using: composite
  steps:
    - name: Generate scan metadata
      id: generate
      shell: bash
      run: |
        set -euo pipefail

        # Generate components
        TIMESTAMP=$(date -u '+%Y-%m-%dT%H-%M-%SZ')
        TIMESTAMP_ISO=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
        SHORT_SHA="${GITHUB_SHA::7}"
        BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
        RUN_NUMBER="${{ github.run_number }}"

        # Generate unique scan ID
        SCAN_ID="${TIMESTAMP}_${BRANCH_NAME}_${SHORT_SHA}_run${RUN_NUMBER}"

        # Generate S3 path (organized by date)
        YEAR=$(date -u '+%Y')
        MONTH=$(date -u '+%m')
        DAY=$(date -u '+%d')
        S3_PATH="${{ inputs.tool }}/${YEAR}/${MONTH}/${DAY}/${SCAN_ID}"

        # Output variables
        echo "scan_id=${SCAN_ID}" >> $GITHUB_OUTPUT
        echo "timestamp=${TIMESTAMP_ISO}" >> $GITHUB_OUTPUT
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
        echo "s3_path=${S3_PATH}" >> $GITHUB_OUTPUT
        echo "metadata_file=metadata.json" >> $GITHUB_OUTPUT

        # Log metadata
        echo "📊 Scan Metadata Generated:"
        echo "  Scan ID: ${SCAN_ID}"
        echo "  Timestamp: ${TIMESTAMP_ISO}"
        echo "  Branch: ${BRANCH_NAME}"
        echo "  Commit: ${SHORT_SHA}"
        echo "  S3 Path: ${S3_PATH}"

    - name: Create metadata.json
      shell: bash
      run: |
        set -euo pipefail

        # Get commit message (escape for JSON)
        COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | jq -Rs .)

        # Get author info
        AUTHOR_NAME=$(git log -1 --pretty=%an)
        AUTHOR_EMAIL=$(git log -1 --pretty=%ae)
        COMMITTER_NAME=$(git log -1 --pretty=%cn)
        COMMITTER_EMAIL=$(git log -1 --pretty=%ce)

        cat > metadata.json <<EOF
        {
          "scan_id": "${{ steps.generate.outputs.scan_id }}",
          "tool": "${{ inputs.tool }}",
          "project": "${{ inputs.project }}",
          "timestamp": "${{ steps.generate.outputs.timestamp }}",
          "git": {
            "repository": "${{ github.repository }}",
            "branch": "${{ steps.generate.outputs.branch_name }}",
            "commit_sha": "${{ github.sha }}",
            "commit_sha_short": "${{ steps.generate.outputs.short_sha }}",
            "commit_message": ${COMMIT_MSG},
            "author": {
              "name": "${AUTHOR_NAME}",
              "email": "${AUTHOR_EMAIL}"
            },
            "committer": {
              "name": "${COMMITTER_NAME}",
              "email": "${COMMITTER_EMAIL}"
            }
          },
          "workflow": {
            "event": "${{ github.event_name }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "run_attempt": "${{ github.run_attempt }}",
            "actor": "${{ github.actor }}",
            "workflow_name": "${{ github.workflow }}",
            "job": "${{ github.job }}"
          },
          "s3": {
            "path": "${{ steps.generate.outputs.s3_path }}"
          },
          "github_actions": {
            "artifact_name": "${{ inputs.tool }}-report-${{ steps.generate.outputs.scan_id }}"
          }
        }
        EOF

        echo " Created metadata.json"
        cat metadata.json | jq .
