name: Deploy Contracts (Sepolia)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-contracts-sepolia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix contracts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy to Sepolia and update AWS Parameter Store
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ROYALTY_BPS: ${{ secrets.ROYALTY_BPS }}
          DEPLOY_CONFIRMATIONS: ${{ secrets.DEPLOY_CONFIRMATIONS }}
        run: |
          # Run deploy script and capture output
          echo "Deploying contracts to Sepolia..."
          DEPLOY_OUTPUT=$(npm run --prefix contracts deploy:sepolia 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Extract contract addresses from deploy output
          TICKET_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep -oP 'TICKET_ADDRESS=\K0x[a-fA-F0-9]{40}' | head -1)
          FUND_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep -oP 'FUND_ADDRESS=\K0x[a-fA-F0-9]{40}' | head -1)
          MARKETPLACE_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep -oP 'MARKETPLACE_ADDRESS=\K0x[a-fA-F0-9]{40}' | head -1)

          echo ""
          echo "Extracted addresses:"
          echo "TICKET_ADDRESS: $TICKET_ADDRESS"
          echo "FUND_ADDRESS: $FUND_ADDRESS"
          echo "MARKETPLACE_ADDRESS: $MARKETPLACE_ADDRESS"

          # Validate addresses
          if [ -z "$TICKET_ADDRESS" ] || [ -z "$FUND_ADDRESS" ] || [ -z "$MARKETPLACE_ADDRESS" ]; then
            echo "Error: Failed to extract contract addresses from deploy output"
            exit 1
          fi

          # Update AWS Parameter Store
          echo ""
          echo "Updating AWS Parameter Store..."

          aws ssm put-parameter \
            --name "/eventfund/dev/TICKET_ADDRESS" \
            --value "$TICKET_ADDRESS" \
            --type "SecureString" \
            --overwrite \
            --region ap-southeast-1
          echo "Updated TICKET_ADDRESS"

          aws ssm put-parameter \
            --name "/eventfund/dev/FUND_ADDRESS" \
            --value "$FUND_ADDRESS" \
            --type "SecureString" \
            --overwrite \
            --region ap-southeast-1
          echo "Updated FUND_ADDRESS"

          aws ssm put-parameter \
            --name "/eventfund/dev/MARKETPLACE_ADDRESS" \
            --value "$MARKETPLACE_ADDRESS" \
            --type "SecureString" \
            --overwrite \
            --region ap-southeast-1
          echo "Updated MARKETPLACE_ADDRESS"

          echo ""
          echo "All contract addresses updated successfully in AWS Parameter Store"
